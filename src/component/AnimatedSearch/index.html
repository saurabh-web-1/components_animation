<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Animated Search</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">

    <div class="search-wrapper">

      <!-- Heading -->
      <div class="heading">
        <div class="badge">
          Premium Search
        </div>

        <h1>Animated Search</h1>

        <p>
          Search with a little bit of magic ✨
        </p>
      </div>


      <!-- Search Form -->
      <form id="searchForm" class="search-form">

        <div id="searchBox" class="search-box">

          <!-- Top highlight -->
          <div class="top-highlight"></div>


          <!-- Search Icon -->
          <div id="iconWrapper" class="icon-wrapper">

            <!-- Search SVG -->
            <svg
              id="searchIcon"
              class="search-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <circle
                cx="11"
                cy="11"
                r="6.5"
                stroke-width="2"
              />

              <path
                d="M16 16L21 21"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>


            <!-- Success SVG -->
            <svg
              id="successIcon"
              class="success-icon hidden"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <path
                d="M5 12.5L9.5 17L19 7"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

          </div>


          <!-- Input -->
          <input
            id="searchInput"
            type="text"
            placeholder="Search anything..."
            autocomplete="off"
          />


          <!-- Button -->
          <button
            id="searchButton"
            type="submit"
          >

            <!-- Spinner -->
            <span
              id="spinner"
              class="spinner hidden"
            ></span>

            <span id="buttonText">
              Search
            </span>

          </button>


          <!-- Scanning Line -->
          <div
            id="scanningLine"
            class="scanning-line hidden"
          ></div>

        </div>

      </form>


      <!-- Result -->
      <div
        id="resultCard"
        class="result-card hidden"
      >

        <div>
          <h3>
            Search completed
          </h3>

          <p>
            Results found for
            "<span id="resultQuery"></span>"
          </p>
        </div>


        <!-- Result Icon -->
        <div class="result-icon">
          ✓
        </div>

      </div>


      <!-- Search Again -->
      <button
        id="searchAgain"
        class="search-again hidden"
      >
        Search again
      </button>

    </div>

  </main>


  <script src="script.js"></script>

</body>
</html>
