<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CopyPulse</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <button id="copyPulse" class="copy-pulse" type="button">

    <!-- Icon -->
    <span class="copy-icon">

      <!-- Copy Icon -->
      <svg
        id="copyIcon"
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect width="14" height="14" x="8" y="8" rx="2"></rect>
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
      </svg>

      <!-- Check Icon -->
      <svg
        id="checkIcon"
        class="hidden"
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M20 6 9 17l-5-5"></path>
      </svg>

    </span>

    <!-- Text -->
    <span id="copyText" class="copy-text">
      Copy Code
    </span>

  </button>

  <script src="script.js"></script>

</body>
</html>
