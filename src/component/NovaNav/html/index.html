<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>NovaNav</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!--  NOVA NAV -->

  <nav class="nova-nav">

    <div class="nav-items">

      <!-- HOME -->
      <button
        class="nav-item active"
        type="button"
        data-name="Home"
      >

        <!-- Active Pill -->
        <span class="active-pill"></span>

        <!-- Icon -->
        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            width="19"
            height="19"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>

        </span>

        <!-- Label -->
        <span class="nav-label">
          Home
        </span>

      </button>


      <!-- SEARCH -->
      <button
        class="nav-item"
        type="button"
        data-name="Search"
      >

        <span class="active-pill"></span>

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            width="19"
            height="19"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle
              cx="11"
              cy="11"
              r="8"
            ></circle>

            <path d="m21 21-4.3-4.3"></path>
          </svg>

        </span>

        <span class="nav-label">
          Search
        </span>

      </button>


      <!-- CREATE -->
      <button
        class="nav-item"
        type="button"
        data-name="Create"
      >

        <span class="active-pill"></span>

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            width="19"
            height="19"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
          </svg>

        </span>

        <span class="nav-label">
          Create
        </span>

      </button>


      <!-- INBOX -->
      <button
        class="nav-item"
        type="button"
        data-name="Inbox"
      >

        <span class="active-pill"></span>

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            width="19"
            height="19"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M21 11.5a8.38 8.38 0 0 1-.9 3.8
              8.5 8.5 0 0 1-7.6 4.7
              8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7
              A8.38 8.38 0 0 1 4 11.5
              8.5 8.5 0 0 1 8.7 3.9
              8.38 8.38 0 0 1 12.5 3
              h.5a8.48 8.48 0 0 1 8 8z"
            ></path>
          </svg>


          <!-- Notification -->
          <span class="notification-dot"></span>

        </span>

        <span class="nav-label">
          Inbox
        </span>

      </button>


      <!-- SAVED -->
      <button
        class="nav-item"
        type="button"
        data-name="Saved"
      >

        <span class="active-pill"></span>

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            width="19"
            height="19"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M20 21v-2a4 4 0 0 0-4-4H8
              a4 4 0 0 0-4 4v2"
            ></path>

            <circle
              cx="12"
              cy="7"
              r="4"
            ></circle>
          </svg>

        </span>

        <span class="nav-label">
          Saved
        </span>

      </button>

    </div>

  </nav>


  <script src="script.js"></script>

</body>
</html>
