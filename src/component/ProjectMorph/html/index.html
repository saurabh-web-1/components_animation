<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8fb3b1">

  <title>ProjectMorph — Selected Works</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="demo-shell">

    <section
      class="project-morph"
      id="projectMorph"
      aria-label="Project showcase"
      tabindex="0"
    >
      <div class="pm-background" aria-hidden="true"></div>
      <div class="pm-texture" aria-hidden="true"></div>

      <div class="pm-brand">
        <span class="pm-brand-mark">P</span>
        <span>PROJECT / STUDIO</span>
      </div>

      <div class="pm-edition">
        <span class="pm-label">SELECTED WORKS</span>
        <span class="pm-counter" aria-live="polite">01 — 04</span>
      </div>

      <div class="pm-orbit" aria-hidden="true">
        <span></span>
      </div>

      <div class="pm-copy">
        <div class="pm-category-row">
          <span class="pm-category-line"></span>
          <span class="pm-category">RESIDENTIAL / 01</span>
        </div>

        <div class="pm-title-window">
          <h1 class="pm-title" aria-label="Onyx"></h1>
        </div>

        <div class="pm-meta">
          <div class="pm-meta-top">
            <span class="pm-location">Forest residence</span>
            <span class="pm-meta-line"></span>
            <span class="pm-year">2026</span>
          </div>

          <p class="pm-description">
            A quiet retreat shaped by natural light, texture, and landscape.
          </p>
        </div>
      </div>

      <div class="pm-image-rail" aria-hidden="true"></div>

      <div class="pm-signature">
        <span class="pm-signature-mark">↗</span>
        <span>Spaces made<br>to feel different</span>
      </div>

      <div class="pm-navigation">
        <div class="pm-progress" aria-label="Project progress"></div>
        <div class="pm-dots" aria-label="Choose project"></div>

        <div class="pm-arrows">
          <button
            class="pm-arrow pm-prev"
            type="button"
            aria-label="Previous project"
          >
            ←
          </button>

          <button
            class="pm-arrow pm-next"
            type="button"
            aria-label="Next project"
          >
            →
          </button>
        </div>
      </div>

    </section>

    <p class="demo-note">
      ProjectMorph · Vanilla HTML, CSS and JavaScript
    </p>

  </main>
</body>
</html>
